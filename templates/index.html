
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>成語射擊 | 手勢闖關</title>
<link rel="stylesheet" href="/static/style.css">

<script type="module" src="/static/mediapipe.js"></script>
</head>
<body>

<div id="camera-wrap">
  <video id="camera-video" autoplay playsinline muted
         style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1);
                opacity:0.45;filter:saturate(0.3) brightness(0.85)"></video>
</div>

<div id="cam-status"
     style="position:fixed;top:8px;right:16px;z-index:200;
            font-family:var(--font-mono);font-size:.72rem;color:var(--muted);letter-spacing:.1em">
  載入中...
</div>

<!-- 音量控制面板 -->
<div id="vol-panel"
     style="position:fixed;bottom:24px;right:20px;z-index:200;
            background:rgba(8,16,28,0.90);border:1px solid rgba(0,229,160,0.2);
            border-radius:6px;padding:12px 16px;backdrop-filter:blur(8px);
            display:flex;flex-direction:column;gap:8px;min-width:180px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px">
    <span style="font-family:var(--font-mono);font-size:.72rem;color:var(--muted);letter-spacing:.1em">🔊 音量</span>
    <button id="vol-mute"
            style="font-family:var(--font-mono);font-size:.68rem;padding:2px 8px;
                   border-radius:3px;border:1px solid rgba(0,229,160,0.25);
                   background:transparent;color:var(--muted);cursor:pointer;transition:all .2s">靜音</button>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-family:var(--font-mono);font-size:.65rem;color:var(--muted);width:28px">主</span>
    <input type="range" id="vol-master" min="0" max="1" step="0.01" value="0.8"
           style="flex:1;accent-color:var(--neon-g);cursor:pointer">
    <span id="vol-master-val" style="font-family:var(--font-mono);font-size:.65rem;color:var(--neon-g);width:28px;text-align:right">80%</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-family:var(--font-mono);font-size:.65rem;color:var(--muted);width:28px">BGM</span>
    <input type="range" id="vol-bgm" min="0" max="1" step="0.01" value="0.5"
           style="flex:1;accent-color:var(--neon-b);cursor:pointer">
    <span id="vol-bgm-val" style="font-family:var(--font-mono);font-size:.65rem;color:var(--neon-b);width:28px;text-align:right">50%</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px">
    <span style="font-family:var(--font-mono);font-size:.65rem;color:var(--muted);width:28px">SFX</span>
    <input type="range" id="vol-sfx" min="0" max="1" step="0.01" value="1.0"
           style="flex:1;accent-color:var(--neon-y);cursor:pointer">
    <span id="vol-sfx-val" style="font-family:var(--font-mono);font-size:.65rem;color:var(--neon-y);width:28px;text-align:right">100%</span>
  </div>
</div>

<div id="effects-layer"></div>

<div id="hud" style="display:none">
  <span class="hud-item">題目 <span class="hud-val" id="hud-q">1/10</span></span>
  <span class="hud-item" style="margin-left:12px">分數 <span class="hud-val" id="hud-score">0</span></span>
</div>
<div id="timer-bar-wrap" style="display:none"><div id="timer-bar" style="width:100%"></div></div>
<div id="hint-text" style="display:none"></div>

<div id="cursor" class="hidden">
  <svg width="56" height="56" viewBox="0 0 56 56" fill="none">
    <circle cx="28" cy="28" r="22" stroke="rgba(0,229,160,0.18)" stroke-width="3" fill="none"/>
    <circle id="cursor-ring" cx="28" cy="28" r="22" stroke="#00e5a0" stroke-width="3" fill="none"
            stroke-dasharray="138.23" stroke-dashoffset="138.23" stroke-linecap="round"
            style="transform:rotate(-90deg);transform-origin:28px 28px;filter:drop-shadow(0 0 6px #00e5a0)"/>
    <circle cx="28" cy="28" r="5" fill="#00e5a0" style="filter:drop-shadow(0 0 6px #00e5a0)"/>
    <line x1="4"  y1="28" x2="18" y2="28" stroke="#00e5a0" stroke-width="1.5" opacity=".6"/>
    <line x1="38" y1="28" x2="52" y2="28" stroke="#00e5a0" stroke-width="1.5" opacity=".6"/>
    <line x1="28" y1="4"  x2="28" y2="18" stroke="#00e5a0" stroke-width="1.5" opacity=".6"/>
    <line x1="28" y1="38" x2="28" y2="52" stroke="#00e5a0" stroke-width="1.5" opacity=".6"/>
  </svg>
</div>

<!-- 開始畫面 -->
<div id="screen-start">
  <div class="panel">
    <div class="game-title">成語闖關</div>
    <div class="game-subtitle">IDIOM SHOOTER · GESTURE CONTROL</div>
    <div class="start-hint">伸出食指 · 懸停難度 1.5 秒 · 開始遊戲</div>

    <!-- 玩家名稱輸入 / 登入系統預留區塊 -->
    <!--
      ════════════════════════════════════════════════════════
      ★ 登入系統預留說明：
        目前顯示「訪客名稱輸入」。
        未來實作登入後，此區塊替換為兩個子狀態：
          (A) 未登入：顯示 [登入] / [註冊] 按鈕
          (B) 已登入：顯示「Hi, {username}」+ [登出] 按鈕，
                      隱藏 player-name 輸入框（改用帳號名）
        JS 端：在 beginGame() 送分時帶入 user_id，
               後端 /leaderboard POST 可辨識帳號。
      ════════════════════════════════════════════════════════
    -->
    <div id="auth-area" style="margin-top:18px;display:flex;flex-direction:column;align-items:center;gap:10px">

      <!-- ── (A) 訪客模式（登入前顯示） ─────────────── -->
      <div id="guest-area" style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <label for="player-name"
               style="font-family:var(--font-mono);font-size:.72rem;color:var(--muted);letter-spacing:.15em">
          輸入名稱（選填）
        </label>
        <input id="player-name" type="text" maxlength="10" placeholder="最多 10 字"
               style="background:rgba(0,0,0,0.4);border:1px solid var(--border);
                      border-radius:4px;padding:8px 14px;color:var(--text);
                      font-family:var(--font-main);font-size:1rem;text-align:center;
                      width:220px;outline:none;transition:border-color .2s"
               onfocus="this.style.borderColor='var(--neon-g)'"
               onblur="this.style.borderColor='var(--border)'">
        <button id="btn-identify"
                style="font-family:var(--font-mono);font-size:.72rem;padding:5px 18px;
                       border-radius:3px;border:1px solid var(--neon-b);
                       background:transparent;color:var(--neon-b);cursor:pointer;
                       transition:all .2s;margin-top:4px">確認身分</button>
      </div>

      <!-- ── (B) 已確認身分（確認後顯示，預設隱藏） ──── -->
      <div id="logged-in-area" style="display:none;flex-direction:column;align-items:center;gap:6px">
        <span style="font-family:var(--font-mono);font-size:.8rem;color:var(--neon-g)">
          👤 <span id="logged-in-name"></span>
        </span>
        <span id="logged-in-best"
              style="font-family:var(--font-mono);font-size:.68rem;color:var(--neon-y);letter-spacing:.05em"></span>
        <button id="btn-logout"
                style="font-family:var(--font-mono);font-size:.68rem;padding:4px 12px;
                       border-radius:3px;border:1px solid rgba(255,68,102,0.4);
                       background:transparent;color:var(--neon-r);cursor:pointer;transition:all .2s">登出</button>
      </div>

    </div>

    <div class="meta-row" style="margin-top:16px">
      <span class="meta-tag">10 題</span>
      <span class="meta-tag">15s / 題</span>
      <span class="meta-tag">混合題型</span>
    </div>

    <!-- 難度選擇（食指懸停 1.5 秒開始） -->
    <div style="margin-top:20px;display:flex;flex-direction:column;align-items:center;gap:12px">
      <div style="font-family:var(--font-mono);font-size:.68rem;color:var(--muted);letter-spacing:.15em">選擇難度</div>
      <div id="difficulty-btns" style="display:flex;gap:18px">

        <div class="diff-btn" data-grade="elementary_low"
             style="position:relative;width:80px;height:44px;display:flex;
                    align-items:center;justify-content:center;
                    font-family:var(--font-mono);font-size:.85rem;
                    color:var(--muted);user-select:none;border-radius:5px;
                    border:1px solid rgba(0,229,160,0.2);transition:color .15s">
          <span style="position:relative;z-index:1">簡單</span>
          <svg style="position:absolute;inset:-6px;width:92px;height:56px;
                      pointer-events:none;overflow:visible" viewBox="0 0 92 56" fill="none">
            <rect x="4" y="4" width="84" height="48" rx="5"
                  stroke="rgba(0,229,160,.12)" stroke-width="3" fill="none"/>
            <rect class="diff-ring" x="4" y="4" width="84" height="48" rx="5"
                  stroke="#00e5a0" stroke-width="3" fill="none"
                  data-circ="264" stroke-dasharray="264" stroke-dashoffset="264"
                  stroke-linecap="round"
                  style="transform:rotate(-90deg);transform-origin:46px 28px;
                         filter:drop-shadow(0 0 6px #00e5a0);
                         transition:stroke-dashoffset .05s linear"/>
          </svg>
        </div>

        <div class="diff-btn" data-grade="elementary_high"
             style="position:relative;width:80px;height:44px;display:flex;
                    align-items:center;justify-content:center;
                    font-family:var(--font-mono);font-size:.85rem;
                    color:var(--muted);user-select:none;border-radius:5px;
                    border:1px solid rgba(0,229,160,0.2);transition:color .15s">
          <span style="position:relative;z-index:1">中等</span>
          <svg style="position:absolute;inset:-6px;width:92px;height:56px;
                      pointer-events:none;overflow:visible" viewBox="0 0 92 56" fill="none">
            <rect x="4" y="4" width="84" height="48" rx="5"
                  stroke="rgba(0,229,160,.12)" stroke-width="3" fill="none"/>
            <rect class="diff-ring" x="4" y="4" width="84" height="48" rx="5"
                  stroke="#00e5a0" stroke-width="3" fill="none"
                  data-circ="264" stroke-dasharray="264" stroke-dashoffset="264"
                  stroke-linecap="round"
                  style="transform:rotate(-90deg);transform-origin:46px 28px;
                         filter:drop-shadow(0 0 6px #00e5a0);
                         transition:stroke-dashoffset .05s linear"/>
          </svg>
        </div>

        <div class="diff-btn" data-grade="junior"
             style="position:relative;width:80px;height:44px;display:flex;
                    align-items:center;justify-content:center;
                    font-family:var(--font-mono);font-size:.85rem;
                    color:var(--muted);user-select:none;border-radius:5px;
                    border:1px solid rgba(0,229,160,0.2);transition:color .15s">
          <span style="position:relative;z-index:1">困難</span>
          <svg style="position:absolute;inset:-6px;width:92px;height:56px;
                      pointer-events:none;overflow:visible" viewBox="0 0 92 56" fill="none">
            <rect x="4" y="4" width="84" height="48" rx="5"
                  stroke="rgba(0,229,160,.12)" stroke-width="3" fill="none"/>
            <rect class="diff-ring" x="4" y="4" width="84" height="48" rx="5"
                  stroke="#00e5a0" stroke-width="3" fill="none"
                  data-circ="264" stroke-dasharray="264" stroke-dashoffset="264"
                  stroke-linecap="round"
                  style="transform:rotate(-90deg);transform-origin:46px 28px;
                         filter:drop-shadow(0 0 6px #00e5a0);
                         transition:stroke-dashoffset .05s linear"/>
          </svg>
        </div>

      </div>

      <!-- 組字模式按鈕 -->
      <div style="margin-top:10px;display:flex;justify-content:center">
        <div class="diff-btn" data-grade="elementary_high" data-mode="compose"
             style="position:relative;width:180px;height:44px;display:flex;
                    align-items:center;justify-content:center;
                    font-family:var(--font-mono);font-size:.85rem;
                    color:var(--muted);user-select:none;border-radius:5px;
                    border:1px solid rgba(0,200,255,0.25);transition:color .15s">
          <span style="position:relative;z-index:1">組字模式</span>
          <svg style="position:absolute;inset:-6px;width:192px;height:56px;
                      pointer-events:none;overflow:visible" viewBox="0 0 192 56" fill="none">
            <rect x="4" y="4" width="184" height="48" rx="5"
                  stroke="rgba(0,200,255,.12)" stroke-width="3" fill="none"/>
            <rect class="diff-ring" x="4" y="4" width="184" height="48" rx="5"
                  stroke="#00c8ff" stroke-width="3" fill="none"
                  data-circ="464" stroke-dasharray="464" stroke-dashoffset="464"
                  stroke-linecap="round"
                  style="transform:rotate(-90deg);transform-origin:96px 28px;
                         filter:drop-shadow(0 0 6px #00c8ff);
                         transition:stroke-dashoffset .05s linear"/>
          </svg>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- 遊戲題目層 -->
<div id="game-layer" style="visibility:hidden;pointer-events:none">
  <div id="char-row"></div>
  <div id="idiom-template"></div>
  <div id="corners"></div>
</div>

<!-- 組字遊戲層 -->
<div id="compose-layer"
     style="visibility:hidden;pointer-events:none;
            position:fixed;inset:0;display:flex;flex-direction:column;
            align-items:center;justify-content:center;gap:28px;z-index:10">

  <!-- 成語意思提示 -->
  <div id="compose-hint"
       style="font-family:var(--font-main);font-size:clamp(1.1rem,2.2vw,1.6rem);
              color:var(--neon-b);text-align:center;letter-spacing:.08em;
              text-shadow:0 0 12px rgba(0,200,255,.6);
              max-width:55vw;line-height:1.5"></div>

  <!-- 四個目標格子 -->
  <div id="compose-slots" style="display:flex;gap:14px"></div>

  <!-- 完成按鈕（四格填滿才顯示） -->
  <div id="compose-done-wrap" style="visibility:hidden">
    <div id="compose-done"
         style="position:relative;width:140px;height:48px;display:flex;
                align-items:center;justify-content:center;
                font-family:var(--font-mono);font-size:1rem;
                color:var(--neon-g);user-select:none;border-radius:6px;
                border:2px solid rgba(0,229,160,0.4);
                background:rgba(0,229,160,0.08);transition:color .15s">
      <span style="position:relative;z-index:1">完成</span>
      <svg style="position:absolute;inset:-7px;width:154px;height:62px;
                  pointer-events:none;overflow:visible" viewBox="0 0 154 62" fill="none">
        <rect x="4" y="4" width="146" height="54" rx="6"
              stroke="rgba(0,229,160,.15)" stroke-width="3" fill="none"/>
        <rect class="compose-done-ring" x="4" y="4" width="146" height="54" rx="6"
              stroke="#00e5a0" stroke-width="3" fill="none"
              data-circ="400" stroke-dasharray="400" stroke-dashoffset="400"
              stroke-linecap="round"
              style="transform:rotate(-90deg);transform-origin:77px 31px;
                     filter:drop-shadow(0 0 6px #00e5a0);
                     transition:stroke-dashoffset .05s linear"/>
      </svg>
    </div>
  </div>

  <!-- 字池 -->
  <div id="compose-pool"
       style="display:flex;gap:12px;flex-wrap:wrap;
              max-width:56vw;justify-content:center"></div>
</div>

<!-- 拖動中的字（跟隨游標） -->
<div id="compose-drag"
     style="display:none;position:fixed;pointer-events:none;z-index:999;
            width:64px;height:64px;align-items:center;justify-content:center;
            font-family:var(--font-main);font-size:2rem;
            color:var(--neon-g);text-shadow:0 0 8px rgba(0,229,160,.8);
            background:rgba(0,229,160,0.12);
            border:2px solid var(--neon-g);border-radius:8px;
            transform:translate(-50%,-50%)"></div>

<!-- 單題結果 -->
<div id="screen-result" style="display:none">
  <div class="result-card" id="result-card">
    <div class="result-status" id="result-status"></div>
    <div class="result-detail" id="result-detail"></div>
    <div class="result-idiom"  id="result-idiom"></div>

    <!-- 解析區塊（答錯/超時才顯示） -->
    <div id="result-explanation" style="display:none">
      <div class="explanation-label">📖 成語解析</div>
      <div class="explanation-text" id="explanation-text"></div>
    </div>

    <div id="result-next-hint">
      <div class="result-next" id="result-next" style="display:none">▶ 伸出食指 5 秒繼續</div>
      <div style="display:none;margin-top:14px;justify-content:center" id="result-ring-wrap">
        <svg width="48" height="48" viewBox="0 0 48 48">
          <circle cx="24" cy="24" r="18" stroke="rgba(255,255,255,.1)" stroke-width="3" fill="none"/>
          <circle id="result-ring" cx="24" cy="24" r="18" stroke="#00e5a0" stroke-width="3" fill="none"
                  stroke-dasharray="113.1" stroke-dashoffset="113.1" stroke-linecap="round"
                  style="transform:rotate(-90deg);transform-origin:24px 24px;
                         filter:drop-shadow(0 0 6px #00e5a0);transition:stroke-dashoffset .05s linear"/>
        </svg>
      </div>
      <div id="result-auto-hint"
           style="display:none;font-family:var(--font-mono);font-size:.8rem;
                  color:var(--neon-b);letter-spacing:.15em;margin-top:10px">
        2 秒後自動繼續...
      </div>
    </div>
  </div>
</div>

<!-- 最終結果 -->
<div id="screen-final" style="display:none">
  <div class="final-card">
    <div class="final-title">遊戲結束！</div>
    <div class="final-score" id="final-score">0 / 100</div>
    <div class="final-rank"  id="final-rank">繼續加油</div>
    <div id="final-duration"
         style="font-family:var(--font-mono);font-size:.9rem;
                color:var(--muted);margin-bottom:16px;letter-spacing:.1em"></div>

    <!-- 積分榜（遊戲結束後內嵌顯示） -->
    <div id="lb-final-wrap" style="margin:20px 0 16px">
      <div style="font-family:var(--font-mono);font-size:.7rem;color:var(--neon-b);
                  letter-spacing:.15em;margin-bottom:10px">🏆 積分榜</div>
      <div id="lb-final-list"
           style="font-family:var(--font-mono);font-size:.75rem;color:var(--muted)">
        載入中...
      </div>
    </div>

    <button class="btn-restart" onclick="Game.reset()">再玩一次</button>
  </div>
</div>

<!-- 積分榜側欄（首頁右上角，遊戲中隱藏） -->
<div id="lb-sidebar"
     style="position:fixed;top:48px;right:20px;z-index:15;
            width:220px;display:none">
  <div style="background:rgba(8,16,28,0.88);border:1px solid rgba(0,200,255,0.2);
              border-radius:6px;padding:12px 16px;backdrop-filter:blur(8px)">
    <div style="font-family:var(--font-mono);font-size:.72rem;color:var(--neon-b);
                letter-spacing:.15em;margin-bottom:10px;text-align:center">
      🏆 積分榜
    </div>
    <div id="lb-sidebar-list">
      <div style="font-family:var(--font-mono);font-size:.68rem;color:var(--muted);text-align:center">
        載入中...
      </div>
    </div>
  </div>
</div>

<!-- 確認身分 Modal -->
<div id="auth-modal" style="display:none;position:fixed;inset:0;z-index:500;
     align-items:center;justify-content:center;
     background:rgba(7,11,18,0.88);backdrop-filter:blur(8px)">
  <div class="auth-card">
    <div style="font-family:var(--font-mono);font-size:.82rem;color:var(--neon-g);
                letter-spacing:.2em;text-align:center;margin-bottom:24px">
      確認身分
    </div>
    <input id="auth-class" class="auth-input" type="text"
           placeholder="班級（例：三年二班）" maxlength="20">
    <input id="auth-seat"  class="auth-input" type="number"
           placeholder="座號（1–99）" min="1" max="99">
    <input id="auth-name"  class="auth-input" type="text"
           placeholder="姓名" maxlength="10">
    <div id="auth-error" class="auth-error"></div>
    <button id="auth-submit" class="auth-btn-submit">確認</button>
    <button id="auth-close"  class="auth-btn-close">取消</button>
  </div>
</div>

<script src="/static/auth.js"></script>
<script src="/static/audio.js"></script>
<script src="/static/effects.js"></script>
<script src="/static/constants.js"></script>
<script src="/static/cursor.js"></script>
<script src="/static/aim.js"></script>
<script src="/static/timer.js"></script>
<script src="/static/game.js"></script>
<script src="/static/volume.js"></script>
</body>
</html>
