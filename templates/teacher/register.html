{% extends "teacher/base.html" %}
{% block title %}註冊{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>註冊</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('teacher.register') }}" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" required autofocus autocomplete="username" maxlength="200" value="{{ email }}">
    </label>
    <label>姓名
      <input type="text" name="name" required maxlength="20" autocomplete="name">
    </label>
    <label>密碼（至少 10 個字元）
      <input type="password" name="password" required minlength="10" maxlength="72" autocomplete="new-password">
    </label>
    <label>再輸入一次密碼
      <input type="password" name="password2" required minlength="10" maxlength="72" autocomplete="new-password">
    </label>
    <button type="submit" class="btn">註冊</button>
  </form>
  <p class="hint">已有帳號？<a href="{{ url_for('teacher.login') }}">登入</a></p>
</section>
{% endblock %}
