{% extends "teacher/base.html" %}
{% block title %}登入{% endblock %}
{% block content %}
<section class="card card-narrow">
  <h1>教師登入</h1>
  {% if error %}<p class="alert" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="{{ url_for('teacher.login') }}" autocomplete="on">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Email
      <input type="email" name="email" required autofocus autocomplete="username" maxlength="200">
    </label>
    <label>密碼
      <input type="password" name="password" required autocomplete="current-password" maxlength="72">
    </label>
    <button type="submit" class="btn">登入</button>
  </form>
  <p class="hint">教師帳號由管理員建立，不開放自行註冊。</p>
</section>
{% endblock %}
